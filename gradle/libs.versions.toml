# TidyNote / NotaRapi — Version Catalog

[versions]
# Gradle / Android
agp = "8.7.3"
gradle = "9.8.0"
kotlin = "2.2.20"
compose-bom = "2024.10.01"
compose-compiler = "2.2.20"

# Ktor backend proxy (modul :backend, deploy sendiri — plan §8/§9)
ktor = "3.1.3"

# Backup terenkripsi (Tink, tersedia offline)
tink = "1.15.0"

# Kover (coverage, plan §8)
kover = "0.9.3"

# AndroidX
activity = "1.10.1"
appcompat = "1.7.0"
constraintlayout = "2.1.4"
core-ktx = "1.15.0"
lifecycle = "2.8.7"
lifecycle-compose = "2.8.7"
navigation = "2.8.5"
room = "2.8.5"
material3 = "1.3.1"
material-icons = "1.3.1"

# Compose
compose-runtime = "1.6.10"
compose-ui = "1.6.10"
compose-material3 = "1.3.1"
compose-navigation = "2.8.5"
compose-foundation = "1.6.10"

# Koin
koin = "3.5.6"

# ML Kit Document Scanner
mlkit-document-scanner = "16.0.0"

# Coroutines
coroutines = "1.9.0"
coroutines-play-services = "1.9.0"

# HTTP Client (OkHttp - already available via Coil)
okhttp = "4.12.0"

# ML Kit
mlkit-text-recognition = "16.0.1"

# Coil (image loading)
coil = "2.7.0"

# Serialization
kotlinx-serialization = "1.7.2"



# KSP
ksp = "2.2.20-2.0.4"

# DataStore
datastore = "1.1.1"

# WorkManager (retry latar, plan §8)
work = "2.9.1"

# Testing
junit = "4.13.2"
junit-jupiter = "5.11.3"
junit-platform = "1.11.3"
truth = "1.1.5"
espresso = "3.6.1"
# 1.6.10 tidak pernah dirilis untuk compose ui-test — rilis 1.6.x berhenti di
# 1.6.8. Compose BOM 2024.10.01 memetakan androidx.compose.ui ke 1.7.5, jadi
# artefak test-nya harus 1.7.5 juga, kalau tidak versinya bentrok.
compose-test = "1.7.5"
room-testing = "2.8.5"
robolectric = "4.12"
# Sepasang dengan androidx.test 1.6.x (era espresso 3.6.1).
androidx-test-ext-junit = "1.2.1"
androidx-test-runner = "1.6.2"

# Lint / Quality
ktlint = "9.4.1"
detekt = "1.23.6"

[libraries]
# AndroidX Core
androidx-core = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle-compose" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-material-icons = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "material-icons" }

# Compose
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose-foundation" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "compose-runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose-ui" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Compose BOM (handled via platform)
compose-bom-platform = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }

# Koin
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }

# Coroutines
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines-play-services" }

# HTTP Client
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }



# ML Kit
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkit-text-recognition" }
mlkit-document-scanner = { group = "com.google.android.gms", name = "play-services-mlkit-document-scanner", version.ref = "mlkit-document-scanner" }

# Coil
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# DataStore (pengganti SharedPreferences, plan §8)
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# WorkManager (retry ekstraksi latar)
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Testing
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-platform" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room-testing" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
compose-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "compose-test" }
compose-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose-test" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }

# Backend proxy (Ktor server — deploy sendiri, bukan di APK)
ktor-server-core = { group = "io.ktor", name = "ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty-jvm", version.ref = "ktor" }
ktor-server-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation-jvm", version.ref = "ktor" }
ktor-serialization-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json-jvm", version.ref = "ktor" }
ktor-server-auth = { group = "io.ktor", name = "ktor-server-auth-jvm", version.ref = "ktor" }
ktor-server-ratelimit = { group = "io.ktor", name = "ktor-server-rate-limit-jvm", version.ref = "ktor" }
ktor-server-status = { group = "io.ktor", name = "ktor-server-status-pages-jvm", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio-jvm", version.ref = "ktor" }
ktor-client-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation-jvm", version.ref = "ktor" }

# Backup terenkripsi (Tink)
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "compose-compiler" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }